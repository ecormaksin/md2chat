name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manually triggering a deploy from the Actions tab.
  workflow_dispatch:

# Only one deploy at a time; cancel any in-progress run when a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspaces-aware)
        run: npm ci

      # Root `build` builds every workspace (packages/* before apps/*), not
      # just @md2chat/web: apps/web imports @md2chat/core and
      # @md2chat/browser-utils via their built dist/ output (see each
      # package's package.json "main"/"types"), and plain npm workspaces has
      # no dependency-graph-aware build step to do that for a scoped build.
      - name: Build all workspaces
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
